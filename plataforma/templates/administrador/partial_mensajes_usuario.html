<!-- partial_mensajes_usuario.html -->
<div class="table-responsive mt-2">
  <table class="table table-sm table-dark table-striped mb-0">
    <thead class="bg-primary text-white">
      <tr>
        <th>Fecha</th>
        <th>Texto</th>
      </tr>
    </thead>
    <tbody>
      {% for m in mensajes %}
      <tr>
        <td>{{ m.creado|date:"d/m H:i" }}</td>
        <td>{{ m.texto|truncatechars:70 }}</td>
      </tr>
      {% empty %}
      <tr><td colspan="2" class="text-center text-muted">Sin mensajes</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
