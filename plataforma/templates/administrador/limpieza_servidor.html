{% extends "administrador/base.html" %}
{% block content %}

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

<style>
.card-panel{ background:#1f1f1f; border-radius:12px; padding:25px; box-shadow:0 0 15px rgba(0,0,0,.25); }
.consola{ background:#111; color:#9ef0c4; border:1px solid #333; border-radius:8px; padding:15px; min-height:200px; max-height:460px; overflow:auto; font-family:Consolas,monospace; font-size:.85rem; white-space:pre-wrap; }
.disco-num{ font-size:1.6rem; font-weight:700;}
#dUsado{color:#ffc107}
</style>

<div class="container-fluid mt-4">
<div class="card-panel">
<h2 class="text-success mb-4"><i class="bi bi-hdd-fill"></i> Limpieza del servidor</h2>

<div class="row g-3 mb-4">
    <div class="col-md-3"><div class="text-white">Total</div><div class="disco-num" id="dTotal">-</div></div>
    <div class="col-md-3"><div class="text-warning">Usado</div><div class="disco-num" id="dUsado">-</div></div>
    <div class="col-md-3"><div class="text-success">Libre</div><div class="disco-num text-success" id="dLibre">-</div></div>
    <div class="col-md-3"><div class="text-white">Uso</div><div class="disco-num" id="dPorc">-</div></div>
</div>
<div class="progress mb-4" style="height:14px;background:#333">
    <div id="dBarra" class="progress-bar bg-success" style="width:0%"></div>
</div>

<div class="d-flex gap-2 mb-3">
    <button id="btnLimpiar" class="btn btn-warning"><i class="bi bi-trash3"></i> Limpiar ahora</button>
    <button id="btnActualizar" class="btn btn-secondary"><i class="bi bi-arrow-repeat"></i> Actualizar espacio</button>
</div>

<div class="consola" id="consola">Todavía no se ejecutó ninguna limpieza.</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
const CSRF = "{{ csrf_token }}";
let timer = null;

function cargarEspacio(){
    $.getJSON("{% url 'limpieza_espacio' %}", function(r){
        $("#dTotal").text(r.total); $("#dUsado").text(r.usado); $("#dLibre").text(r.libre);
        $("#dPorc").text(r.porcentaje + "%");
        $("#dBarra").css("width", r.porcentaje + "%")
            .toggleClass("bg-danger", r.porcentaje >= 85).toggleClass("bg-success", r.porcentaje < 85);
    }).fail(function(){ $("#dTotal").text("Error"); });
}

function consultarEstado(){
    $.getJSON("{% url 'limpieza_estado' %}", function(r){
        if(r.log){
            $("#consola").text(r.log);
            const c = document.getElementById("consola"); c.scrollTop = c.scrollHeight;
        }
        if(r.terminado){
            clearInterval(timer); timer = null;
            $("#btnLimpiar").prop("disabled", false);
            cargarEspacio();
            Swal.fire({ icon:"success", title:"Limpieza terminada", timer:1800, showConfirmButton:false });
        }
    });
}

function empezarSeguimiento(){
    $("#btnLimpiar").prop("disabled", true);
    if(!timer){ timer = setInterval(consultarEstado, 3000); }
}

$("#btnActualizar").click(cargarEspacio);

$("#btnLimpiar").click(function(){
    Swal.fire({
        title: "¿Limpiar el servidor?",
        html: "Se borran las imágenes Docker sin uso, la caché de build y los logs viejos.<br><b>No lo hagas mientras se está desplegando.</b>",
        icon: "warning", showCancelButton: true, confirmButtonText: "Limpiar", cancelButtonText: "Cancelar"
    }).then(function(r){
        if(!r.isConfirmed) return;
        $("#consola").text("Iniciando limpieza...");
        $.ajax({
            url: "{% url 'limpieza_iniciar' %}", method: "POST", headers: { "X-CSRFToken": CSRF },
            success: function(){ empezarSeguimiento(); },
            error: function(xhr){
                Swal.fire({ icon:"error", title:"No se pudo iniciar", text:(xhr.responseJSON && xhr.responseJSON.message) || "Error inesperado." });
            }
        });
    });
});

$(document).ready(function(){
    cargarEspacio();
    $.getJSON("{% url 'limpieza_estado' %}", function(r){
        if(r.log){ $("#consola").text(r.log); }
        if(r.log && !r.terminado){ empezarSeguimiento(); }
    });
});
</script>
{% endblock %}
