<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8">
    <title>Alta y Edición de Cupón</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
     <link rel="icon" href="{% static 'img/logo/logo-marema96.png' %}" type="image/png" />
    <!-- Bootstrap y estilos base -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #0e0e0e;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            padding-top: 50px;
        }
        .container {
            max-width: 800px;
        }
        .form-control, .form-select {
            background-color: #1a1a1a;
            border: 1px solid #12f693;
            color: white;
        }
        .form-control:focus, .form-select:focus {
            border-color: #12f693;
            box-shadow: 0 0 10px #12f69344;
        }
        label {
            color: #12f693;
            font-weight: bold;
        }
        .btn-primary {
            background-color: #12f693;
            border: none;
            color: #000;
            font-weight: bold;
        }
        .btn-primary:hover {
            background-color: #0df284;
        }
        .card {
            background-color: #151515;
            border: 1px solid #12f69333;
            border-radius: 1rem;
            padding: 2rem;
            margin-top: 2rem;
            box-shadow: 0 0 10px #12f69311;
        }
        .title {
            text-align: center;
            color: #12f693;
            font-size: 1.8rem;
            margin-bottom: 1rem;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h1 class="title">Alta y Edición de Cupón</h1>
        <form method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="codigo">Código del Cupón</label>
                <input type="text" name="codigo" id="codigo" class="form-control" required placeholder="Ej: DESC20" maxlength="50" value="{% if cupon %}{{ cupon.codigo }}{% endif %}">
            </div>

            <div class="mb-3">
                <label for="descuento_porcentaje">Descuento Porcentaje</label>
                <input type="number" name="descuento_porcentaje" id="descuento_porcentaje" class="form-control" required min="0" max="100" placeholder="Ej: 20 para 20% off" value="{% if cupon %}{{ cupon.descuento_porcentaje }}{% endif %}">
            </div>

            <div class="mb-3">
                <label for="fecha_inicio">Fecha de Inicio</label>
                <input type="date" name="fecha_inicio" id="fecha_inicio" class="form-control" required value="{% if cupon %}{{ cupon.fecha_inicio|date:'Y-m-d' }}{% endif %}">
            </div>

            <div class="mb-3">
                <label for="fecha_vencimiento">Fecha de Vencimiento (opcional)</label>
                <input type="date" name="fecha_vencimiento" id="fecha_vencimiento" class="form-control" value="{% if cupon and cupon.fecha_vencimiento %}{{ cupon.fecha_vencimiento|date:'Y-m-d' }}{% endif %}">
            </div>

            <div class="mb-3">
                <label for="usos_maximos">Usos Máximos (0 = ilimitado)</label>
                <input type="number" name="usos_maximos" id="usos_maximos" class="form-control" required min="0" placeholder="Ej: 5" value="{% if cupon %}{{ cupon.usos_maximos }}{% endif %}">
            </div>

            <div class="mb-3">
                <label for="usos_actuales">Usos Actuales (solo lectura)</label>
                <input type="number" name="usos_actuales" id="usos_actuales" class="form-control" readonly value="{% if cupon %}{{ cupon.usos_actuales }}{% endif %}">
            </div>

            <div class="mb-3 form-check">
                <input type="checkbox" name="activo" id="activo" class="form-check-input" {% if cupon and cupon.activo %}checked{% endif %}>
                <label for="activo" class="form-check-label">Activo</label>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-4">Guardar Cupón</button>
            <a class="btn btn-secondary w-100 mt-2" href="{% url 'admin_panel' %}">Volver al panel</a>
        </form>
    </div>
</div>


<!-- ventana modal inicia -->
<div class="modal fade" id="modalExito" tabindex="-1" aria-labelledby="modalExitoLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content text-dark">
            <div class="modal-header bg-success text-white">
                <h5 class="modal-title" id="modalExitoLabel">¡Cupón guardado!</h5>
            </div>
            <div class="modal-body text-center">
                ✅ El cupón fue registrado/actualizado con éxito.
            </div>
            <div class="modal-footer">
                <a href="{% url 'alta_y_edicion_cupones' %}" class="btn btn-success">Cargar otro</a>
                <a href="{% url 'admin_panel' %}" class="btn btn-outline-success">Volver al inicio</a>
            </div>
        </div>
    </div>
</div>
<!-- ventana modal fin -->

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

{% if guardado_exitoso %}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const modal = new bootstrap.Modal(document.getElementById('modalExito'));
        modal.show();
    });
</script>
{% endif %}

</body>
</html>
