{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Error 404 – Not Found</title>
    <style>
        body {
            background: #f8f9fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .error-container {
            background: white;
            padding: 40px 60px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .error-code {
            font-size: 96px;
            font-weight: 900;
            color: #cf30ff;
            margin-bottom: 10px;
        }
        .error-title {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 12px;
        }
        .error-description {
            font-size: 16px;
            color: #555;
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .error-icon {
            font-size: 64px;
            margin-bottom: 20px;
            color: #12f693;
        }
        a.button-home {
            display: inline-block;
            background: #12f693;
            color: white;
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }
        a.button-home:hover {
            background: #12f693;
        }
    </style>
</head>
<body>
    <div class="error-container">
        <div class="error-icon">&#128269;</div> <!-- 🔍 magnifying glass -->
        <div class="error-code">404</div>
        <div class="error-title">404 – Not Found</div>
        <div class="error-description">
            Lo sentimos, la página que buscas no existe o fue movida. Verifica la URL o regresa al inicio.
        </div>
        <a href="{% url 'inicio' %}" class="button-home">Volver al inicio</a>
    </div>
</body>
</html>
