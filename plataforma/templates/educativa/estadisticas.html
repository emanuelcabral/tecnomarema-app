<div class="container mb-4">

    <div class="col-md-3">

<script>
  // Obtiene referencias a los selects de filtros
  const claseSelect = document.getElementById('claseSelect');
  const ambitoSelect = document.getElementById('ambitoSelect');

  // Agrega listeners para actualizar gráficos al cambiar selección
  claseSelect.addEventListener('change', actualizarEstadisticas);
  ambitoSelect.addEventListener('change', actualizarEstadisticas);

  // Función principal para actualizar los datos y gráficos
  async function actualizarEstadisticas() {
    const clase = claseSelect.value;
    const ambito = ambitoSelect.value;

    if (!clase) return;  // Si no hay clase seleccionada, no hacer nada

    try {
      // Petición a la API con filtros de clase y ámbito
      const response = await fetch(`/api/estadisticas_valoracion/?clase=${clase}&ambito=${ambito}`);
      const data = await response.json();

      if (!data) {
        alert("No se pudieron cargar los datos de estadística.");
        return;
      }

      // Actualiza cada gráfico con los datos recibidos
      actualizarGraficoLiked(data.liked);
      actualizarGraficoPromedio(data.promedios);
      actualizarGraficoValoracion(data.valoraron_vs_no);
      actualizarGraficosPorPregunta(data.distribuciones);  // Actualiza gráficos desglosados

    } catch (error) {
      console.error("Error al obtener estadísticas:", error);
      alert("Hubo un problema al obtener los datos de valoración.");
    }
  }

  // Actualiza gráfico "¿Te gustó la clase?"
  function actualizarGraficoLiked(data) {
    likedChart.data.datasets[0].data = [
      data.gustó?.total || 0,
      data.masomenos?.total || 0,
      data.nogusto?.total || 0
    ];
    likedChart.update();
  }

  // Actualiza gráfico de promedios de valoración por categoría
  function actualizarGraficoPromedio(data) {
    promedioChart.data.datasets[0].data = [
      data.profe || 0,
      data.contenido || 0,
      data.plataforma || 0,
      data.streaming || 0
    ];
    promedioChart.update();
  }

  // Actualiza gráfico comparativo valoraron vs no valoraron
  function actualizarGraficoValoracion(data) {
    comparacionChart.data.datasets[0].data = [
      data.valoraron || 0,
      data.no_valoraron || 0
    ];
    comparacionChart.update();
  }

  // Actualiza los gráficos desglosados por pregunta, destruyendo los previos para recrear con nuevos datos
  function actualizarGraficosPorPregunta(distribuciones) {
    const labels = Array.from({ length: 10 }, (_, i) => (i + 1).toString());

    const configs = [
      {
        id: 'professorRoleChart',
        data: distribuciones.rol_profe,
        label: '¿Cómo valoras al profesor?'
      },
      {
        id: 'contentChart',
        data: distribuciones.contenido,
        label: '¿Cómo valoras el contenido?'
      },
      {
        id: 'platformChart',
        data: distribuciones.plataforma,
        label: '¿Cómo valoras la plataforma?'
      },
      {
        id: 'streamingChart',
        data: distribuciones.streaming,
        label: '¿Cómo valoras el streaming?'
      }
    ];

    configs.forEach(({ id, data, label }) => {
      const ctx = document.getElementById(id).getContext('2d');

      // Destruye chart previo si existe para evitar duplicados y fugas de memoria
      if (window[id]) {
        window[id].destroy();
      }

      // Crea un nuevo gráfico con datos actualizados
      window[id] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: labels,
          datasets: [{
            label: label,
            data: data,
            backgroundColor: '#12f693',
            borderColor: '#12f693',
            borderWidth: 1
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: {
              labels: { color: '#fff' }
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              max: Math.max(...data, 10),
              ticks: { stepSize: 1, color: '#fff' }
            },
            x: {
              ticks: { color: '#fff' }
            }
          }
        }
      });
    });
  }
</script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const ambitoSelect = document.getElementById('ambitoSelect');
  const cursoSelect = document.getElementById('cursoSelect');
  const comisionSelect = document.getElementById('comisionSelect');
  const claseSelect = document.getElementById('claseSelect');

  // Reset y desactivar todos los selects
  function resetSelects() {
    cursoSelect.innerHTML = '<option value="">Seleccione un curso</option>';
    comisionSelect.innerHTML = '<option value="">Seleccione una comisión</option>';
    claseSelect.innerHTML = '<option value="">Seleccione una clase</option>';
    cursoSelect.disabled = true;
    comisionSelect.disabled = true;
    claseSelect.disabled = true;
  }

  ambitoSelect.addEventListener('change', function () {
    const ambito = this.value;
    resetSelects();

    if (ambito === 'curso' || ambito === 'comision' || ambito === 'clase') {
      cargarCursos();
    }

    if (ambito === 'institucion') {
      // Lógica para institución completa (puede llamar directamente a actualizarEstadisticas)
      actualizarEstadisticas('institucion');
    }
  });

  cursoSelect.addEventListener('change', function () {
    const cursoId = this.value;
    comisionSelect.innerHTML = '<option value="">Seleccione una comisión</option>';
    claseSelect.innerHTML = '<option value="">Seleccione una clase</option>';
    comisionSelect.disabled = true;
    claseSelect.disabled = true;

    if (cursoId && (ambitoSelect.value === 'comision' || ambitoSelect.value === 'clase')) {
      cargarComisiones(cursoId);
    }

    if (ambitoSelect.value === 'curso') {
      actualizarEstadisticas('curso', cursoId);
    }
  });

  comisionSelect.addEventListener('change', function () {
    const comisionId = this.value;
    claseSelect.innerHTML = '<option value="">Seleccione una clase</option>';
    claseSelect.disabled = true;

    if (comisionId && ambitoSelect.value === 'clase') {
      cargarClases(comisionId);
    }

    if (ambitoSelect.value === 'comision') {
      actualizarEstadisticas('comision', comisionId);
    }
  });

  claseSelect.addEventListener('change', function () {
    const claseId = this.value;
    if (claseId && ambitoSelect.value === 'clase') {
      actualizarEstadisticas('clase', claseId);
    }
  });

  // Fetch para cargar cursos
  function cargarCursos() {
    fetch('/api/listado_cursos/')
      .then(response => response.json())
      .then(data => {
        cursoSelect.innerHTML = '<option value="">Seleccione un curso</option>';
        data.forEach(curso => {
          const option = document.createElement('option');
          option.value = curso.id;
          option.textContent = curso.nombre;
          cursoSelect.appendChild(option);
        });
        cursoSelect.disabled = false;
      });
  }

  // Fetch para cargar comisiones
  function cargarComisiones(cursoId) {
    fetch(`/api/listado_comisiones/?curso=${cursoId}`)
      .then(response => response.json())
      .then(data => {
        comisionSelect.innerHTML = '<option value="">Seleccione una comisión</option>';
        data.forEach(com => {
          const option = document.createElement('option');
          option.value = com.id;
          option.textContent = com.nombre;
          comisionSelect.appendChild(option);
        });
        comisionSelect.disabled = false;
      });
  }

  // Fetch para cargar clases
  function cargarClases(comisionId) {
    fetch(`/api/listado_clases/?comision=${comisionId}`)
      .then(response => response.json())
      .then(data => {
        claseSelect.innerHTML = '<option value="">Seleccione una clase</option>';
        data.forEach(clase => {
          const option = document.createElement('option');
          option.value = clase.id;
          option.textContent = clase.nombre;
          claseSelect.appendChild(option);
        });
        claseSelect.disabled = false;
      });
  }

  // Lógica de actualización de estadísticas
  function actualizarEstadisticas(ambito, id = '') {
    let url = `/api/estadisticas_valoracion/?ambito=${ambito}`;
    if (id) url += `&id=${id}`;

    fetch(url)
      .then(r => r.json())
      .then(data => {
        // Acá llamás a tus funciones para actualizar gráficos
        actualizarGraficoLiked(data.liked);
        actualizarGraficoPromedio(data.promedios);
        actualizarGraficoValoracion(data.valoraron_vs_no);
        actualizarGraficosPorPregunta(data.distribuciones);
      });
  }
});
</script>
