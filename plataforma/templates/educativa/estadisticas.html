<!DOCTYPE html>
<html lang="es">
<head>
    {% load static %}
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Estadísticas de Valoración de Clase</title>
    <link rel="icon" href="{% static 'img/logo/logo-marema96.png' %}" type="image/png" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        body {
            background-color: #000;
            color: #fff;
            padding: 2rem;
            font-family: 'Segoe UI', sans-serif;
        }
        h2, h3 {
            text-align: center;
            color: #12f693;
            margin: 2rem 0;
        }
        .chart-container {
            background-color: #111;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 2rem;
            box-shadow: 0 0 15px rgba(18, 246, 147, 0.3);
        }
        select.form-select {
            background-color: #111;
            color: #12f693;
            border: 1px solid #12f693;
        }
        label {
            margin-top: 1rem;
            color: #fff;
        }
        canvas { max-width: 100%; }
    </style>
</head>
<body>

<h2>Valoraciones Generales de Clase</h2>

<div class="container mb-4">
    <div class="row g-3">
        <div class="col-md-3">
            <label>Ámbito de análisis:</label>
            <select class="form-select" id="ambitoSelect">
                <option value="institucion" selected>Toda la institución</option>
                <option value="curso">Curso completo</option>
                <option value="comision">Comisión completa</option>
                <option value="clase">Clase específica</option>
            </select>
        </div>
        <div class="col-md-3">
            <label>Curso:</label>
            <select class="form-select" id="cursoSelect" disabled>
                <option value="">Seleccione un curso</option>
            </select>
        </div>
        <div class="col-md-3">
            <label>Comisión:</label>
            <select class="form-select" id="comisionSelect" disabled>
                <option value="">Seleccione una comisión</option>
            </select>
        </div>
        <div class="col-md-3">
            <label>Clase:</label>
            <select class="form-select" id="claseSelect" disabled>
                <option value="">Seleccione una clase</option>
            </select>
        </div>
    </div>
</div>

<!-- Gráficos Generales -->
<div class="container">
    <div class="row">
        <div class="col-12 chart-container">
            <canvas id="likedClassChart"></canvas>
        </div>
    </div>
    <div class="row">
        <div class="col-md-6 chart-container">
            <canvas id="averageScoreChart"></canvas>
        </div>
        <div class="col-md-6 chart-container">
            <canvas id="comparisonChart"></canvas>
        </div>
    </div>
</div>

<!-- Gráficos Desglosados -->
<h3>Estadísticas por Pregunta (1-10)</h3>
<div class="container">
    <div class="row">
        <div class="col-md-6 chart-container"><canvas id="professorRoleChart"></canvas></div>
        <div class="col-md-6 chart-container"><canvas id="contentChart"></canvas></div>
        <div class="col-md-6 chart-container"><canvas id="platformChart"></canvas></div>
        <div class="col-md-6 chart-container"><canvas id="streamingChart"></canvas></div>
    </div>
</div>

<script>
// ==================== CHARTS ====================
let likedChart, promedioChart, comparacionChart;
let chartsPorPregunta = {};

function initCharts() {
    likedChart = new Chart(document.getElementById('likedClassChart'), {
        type: 'bar',
        data: { labels: ["Me gustó", "Más o menos", "No me gustó"], datasets: [{ data: [0,0,0], backgroundColor: ["#12f693","#00ffff","#ff00c8"] }] },
        options: { responsive: true }
    });

    promedioChart = new Chart(document.getElementById('averageScoreChart'), {
        type: 'bar',
        data: { labels: ["Rol del profe", "Contenido", "Plataforma", "Streaming"], datasets: [{ data: [0,0,0,0], backgroundColor: "#12f693" }] },
        options: { responsive: true, scales: { y: { max: 10 } } }
    });

    comparacionChart = new Chart(document.getElementById('comparisonChart'), {
        type: 'doughnut',
        data: { labels: ["Valoraron", "No valoraron"], datasets: [{ data: [0,0], backgroundColor: ["#00ffff","#555"] }] }
    });
}

function actualizarGraficos(data) {
    likedChart.data.datasets[0].data = [
        data.liked?.gustó?.total || 0,
        data.liked?.masomenos?.total || 0,
        data.liked?.nogusto?.total || 0
    ];
    likedChart.update();

    promedioChart.data.datasets[0].data = [
        data.promedios?.profe || 0,
        data.promedios?.contenido || 0,
        data.promedios?.plataforma || 0,
        data.promedios?.streaming || 0
    ];
    promedioChart.update();

    comparacionChart.data.datasets[0].data = [
        data.valoraron_vs_no?.valoraron || 0,
        data.valoraron_vs_no?.no_valoraron || 0
    ];
    comparacionChart.update();

    actualizarGraficosPorPregunta(data.distribuciones || {});
}

function actualizarGraficosPorPregunta(dist) {
    const labels = Array.from({length:10}, (_,i) => (i+1).toString());
    const configs = [
        {id:'professorRoleChart', data:dist.rol_profe || [], label:'Rol del Profesor'},
        {id:'contentChart', data:dist.contenido || [], label:'Contenido'},
        {id:'platformChart', data:dist.plataforma || [], label:'Plataforma'},
        {id:'streamingChart', data:dist.streaming || [], label:'Streaming'}
    ];

    configs.forEach(({id, data, label}) => {
        if (chartsPorPregunta[id]) chartsPorPregunta[id].destroy();
        chartsPorPregunta[id] = new Chart(document.getElementById(id), {
            type: 'bar',
            data: { labels, datasets: [{ label, data, backgroundColor: '#12f693' }] },
            options: { responsive: true, scales: { y: { beginAtZero: true, max: 10 } } }
        });
    });
}

// ==================== FILTROS ====================
document.addEventListener('DOMContentLoaded', function () {
    initCharts();

    const ambitoSelect = document.getElementById('ambitoSelect');
    const cursoSelect = document.getElementById('cursoSelect');
    const comisionSelect = document.getElementById('comisionSelect');
    const claseSelect = document.getElementById('claseSelect');

    async function actualizarEstadisticas(ambito, id = '') {
        let url = `/api/estadisticas_valoracion/?ambito=${ambito}`;
        if (id) url += `&id=${id}`;

        try {
            const res = await fetch(url);
            const data = await res.json();
            actualizarGraficos(data);
        } catch (e) {
            console.error(e);
        }
    }

    ambitoSelect.addEventListener('change', function () {
        cursoSelect.disabled = comisionSelect.disabled = claseSelect.disabled = true;
        cursoSelect.innerHTML = '<option value="">Seleccione un curso</option>';
        comisionSelect.innerHTML = '<option value="">Seleccione una comisión</option>';
        claseSelect.innerHTML = '<option value="">Seleccione una clase</option>';

        if (this.value === 'institucion') {
            actualizarEstadisticas('institucion');
        } else {
            fetch('/api/cursos_estadisticas/')
                .then(r => r.json())
                .then(data => {
                    cursoSelect.innerHTML = '<option value="">Seleccione un curso</option>';
                    data.forEach(c => cursoSelect.add(new Option(c.nombre, c.id)));
                    cursoSelect.disabled = false;
                });
        }
    });

    cursoSelect.addEventListener('change', function () {
        if (!this.value) return;
        const ambito = ambitoSelect.value;
        if (ambito === 'curso') actualizarEstadisticas('curso', this.value);
        else fetch(`/api/comisiones_estadisticas/?curso=${this.value}`).then(r => r.json()).then(data => {
            comisionSelect.innerHTML = '<option value="">Seleccione una comisión</option>';
            data.forEach(c => comisionSelect.add(new Option(c.nombre, c.id)));
            comisionSelect.disabled = false;
        });
    });

    comisionSelect.addEventListener('change', function () {
        if (!this.value) return;
        const ambito = ambitoSelect.value;
        if (ambito === 'comision') actualizarEstadisticas('comision', this.value);
        else fetch(`/api/clases_estadisticas/?comision=${this.value}`).then(r => r.json()).then(data => {
            claseSelect.innerHTML = '<option value="">Seleccione una clase</option>';
            data.forEach(c => claseSelect.add(new Option(c.nombre, c.id)));
            claseSelect.disabled = false;
        });
    });

    claseSelect.addEventListener('change', function () {
        if (this.value && ambitoSelect.value === 'clase') actualizarEstadisticas('clase', this.value);
    });

    actualizarEstadisticas('institucion');
});
</script>

</body>
</html>
