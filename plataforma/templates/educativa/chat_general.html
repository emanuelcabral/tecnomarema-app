{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Chat Interno</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="{% static 'css/chat.css' %}">
  <style>
    body {
      background-color: #111;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
    }

    .chat-container {
      height: 90vh;
      display: flex;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,0,0,0.7);
    }

    .sidebar {
      width: 280px;
      background-color: #1a1a1a;
      padding: 1rem;
      overflow-y: auto;
    }

    .sidebar h5 {
      color: #12f693;
      margin-bottom: 1rem;
    }

    .chat-list button {
      background: none;
      border: none;
      width: 100%;
      color: #ccc;
      text-align: left;
      padding: 0.5rem;
      border-bottom: 1px solid #333;
    }

    .chat-list button.active,
    .chat-list button:hover {
      color: #fff;
      background-color: #222;
    }

    .chat-area {
      flex: 1;
      background-color: #222;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .messages {
      padding: 1rem;
      overflow-y: auto;
      flex-grow: 1;
    }

    .message {
      max-width: 70%;
      margin-bottom: 0.75rem;
      padding: 0.75rem 1rem;
      border-radius: 15px;
      word-wrap: break-word;
    }

    .from-me {
      background-color: #0bd68f;
      color: #000;
      align-self: flex-end;
    }

    .from-other {
      background-color: #444;
      color: #fff;
      align-self: flex-start;
    }

    .message-input {
      border-top: 1px solid #333;
      padding: 1rem;
      display: flex;
      align-items: center;
    }

    .message-input textarea {
      background: #333;
      color: #fff;
      border: none;
      resize: none;
      height: 45px;
      border-radius: 10px;
      padding: 0.5rem;
      flex: 1;
      margin-right: 0.5rem;
    }

    .message-input textarea:focus {
      outline: none;
    }

    .message-input button {
      background-color: #12f693;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      color: #000;
    }

    .message-input .file-btn {
      background: none;
      color: #ccc;
      font-size: 1.3rem;
      margin-right: 10px;
      border: none;
    }

    .message-input .file-btn:hover {
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="container-fluid py-3">
    <div class="chat-container">
      <!-- Sidebar -->
      <div class="sidebar">
        <h5>Chats</h5>
        <div class="chat-list">
          <button class="active"># General</button>
          <button># Comisión 20735</button>
          <button>@ Emanuel Cabral</button>
        </div>
      </div>

      <!-- Chat area -->
      <div class="chat-area d-flex flex-column">
        <!-- Messages -->
        <!-- <div class="messages d-flex flex-column" id="message-list"> -->
        <div class="messages d-flex flex-column" id="message-list">
        {% for mensaje in mensajes %}
            <div class="message {% if mensaje.remitente == request.user %}from-me{% else %}from-other{% endif %}">
            <strong>{{ mensaje.remitente.nombre_usuario }}</strong><br>
            {{ mensaje.texto }}
            <div class="small text-muted">{{ mensaje.creado|date:"d/m H:i" }}</div>
            </div>
        {% empty %}
            <p class="text-center text-muted">Aún no hay mensajes en este chat.</p>
        {% endfor %}
        </div>

    </div>

        <!-- <form class="message-input" id="message-form" method="POST">
        {% csrf_token %}
        <button type="button" class="file-btn" title="Adjuntar archivo">
            📎
        </button>
        <textarea name="mensaje" placeholder="Escribe tu mensaje..." required></textarea>
        <button type="submit">Enviar</button>
        </form> -->

        <form class="message-input" id="message-form" method="POST" enctype="multipart/form-data"
      action="{% url 'enviar_mensaje_general' %}">
  {% csrf_token %}

  <!-- Input oculto para archivo -->
  <input type="file" name="archivo" id="file-input" style="display:none;"
         accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.ppt,.pptx,.zip,.rar">

  <!-- Botón adjuntar -->
  <button type="button" class="file-btn" title="Adjuntar archivo"
          onclick="document.getElementById('file-input').click();">
    Paperclip
  </button>

  <!-- Caja de texto -->
  <textarea name="mensaje" id="mensaje-input"
            placeholder="Escribe o pega una captura (Ctrl + V)..." rows="1"
            style="resize:none;flex:1;margin:0 8px;background:#333;color:#fff;border:none;border-radius:10px;padding:0.5rem;"></textarea>

  <!-- Vista previa de imagen pegada -->
  <div id="preview-container" style="display: none; margin: 5px 15px; max-width: 200px; position: relative;box-shadow: 2px 2px 5px 5px #000"><img id="preview-img" style="max-width: 100%; border-radius: 8px;" />
      <button type="button" id="remove-preview" style="background:#cf30ff;color:#fff;border:2px solid #000;border-radius:50%;width:26px;height:26px;font-size:20px;font-weight:bold;cursor:pointer;box-shadow:0 4px 8px rgba(0,0,0,0.25);display:flex;justify-content:center;align-items:center;position:absolute;top:0;right:0;transform:translate(50%,-50%);">×</button>
  </div>

  <!-- Botón enviar -->
  <button type="submit" id="send-btn">Enviar</button>
</form>

<script>
let imagenBlob = null;

// Pegar con Ctrl+V
document.getElementById('mensaje-input').addEventListener('paste', e => {
  const items = e.clipboardData.items;
  for (let i of items) {
    if (i.type.startsWith('image/')) {
      const blob = i.getAsFile();
      mostrarPreview(blob);
      e.preventDefault();
      break;
    }
  }
});

function mostrarPreview(blob) {
  const cont = document.getElementById('preview-container');
  const img = document.getElementById('preview-img');
  const rm = document.getElementById('remove-preview');
  const url = URL.createObjectURL(blob);
  img.src = url;
  cont.style.display = 'block';
  imagenBlob = blob;
  rm.onclick = () => {
    cont.style.display = 'none';
    URL.revokeObjectURL(url);
    imagenBlob = null;
  };
}

// Enviar con submit normal (NO AJAX)
document.getElementById('message-form').addEventListener('submit', function(e) {
  if (imagenBlob) {
    const input = document.createElement('input');
    input.type = 'file';
    input.name = 'archivo';
    input.style.display = 'none';
    this.appendChild(input);

    const dt = new DataTransfer();
    dt.items.add(new File([imagenBlob], 'captura.png', { type: 'image/png' }));
    input.files = dt.files;
  }
  // NO HAY preventDefault() → se envía el form normal
});


// Enviar con Enter (Shift+Enter = nueva línea)
document.getElementById('mensaje-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    this.closest('form').requestSubmit();
  }
});

</script>

      </div>
    </div>
  </div>

  <script>
    // Scroll automático al último mensaje
    const messages = document.getElementById('message-list');
    messages.scrollTop = messages.scrollHeight;
  </script>


  <!-- actualizar badges inicia -->
   <script>
function actualizarBadges() {
  fetch("{% url 'mensajes_nuevos_view' %}")
    .then(res => res.json())
    .then(data => {
      const contenedor = document.querySelector('.chat-list');
      contenedor.innerHTML = ''; // limpia

      // Chat general
      contenedor.innerHTML += `
        <button class="${data.general > 0 ? 'fw-bold text-success' : ''}">
          # General
          ${data.general > 0 ? `<span class="badge bg-danger ms-2">${data.general}</span>` : ''}
        </button>
      `;

      // Chats privados
      data.privados.forEach(p => {
        contenedor.innerHTML += `
          <button onclick="location.href='/chat/privado/${p.nombre}/'">
            @ ${p.nombre}
            ${p.nuevos > 0 ? `<span class="badge bg-success ms-2">${p.nuevos}</span>` : ''}
          </button>
        `;
      });
    })
    .catch(err => console.error('Error actualizando badges:', err));
}

// Ejecutar cada 3 segundos
setInterval(actualizarBadges, 3000);
actualizarBadges();
</script>

  <!-- actualizar badges fin -->

</body>
</html>
